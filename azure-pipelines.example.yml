# Example Azure DevOps pipeline — reference material, not a working config.
# Bootstrapping a NEW environment: copy this file to azure-pipelines.yml in
# your repo and adapt it (agent pool, terraform availability on the agents,
# proxy/registry mirrors). If an adapted azure-pipelines.yml already exists,
# keep it — never delete it or repoint CI at this example.
# Keep pipelines thin shells over make — all logic lives in the Makefile
# (see AGENTS.md rule 9).
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: make env
    displayName: Toolchain versions
  - script: make test
    displayName: Python unit tests
  # `make validate` requires terraform on the agent. Hosted ubuntu images
  # ship it; for self-hosted pools either bake terraform into the agent
  # image or insert your installer task above this step, e.g. the
  # Microsoft DevLabs extension:
  # - task: TerraformInstaller@1
  #   inputs:
  #     terraformVersion: "1.15.4"
  - script: make validate
    displayName: Terraform format check
  # Drift detection and env-root consistency are adopter concerns: scheduling,
  # credential injection, and failure routing depend on your ADO setup. Two
  # commented-out examples for reference:
  #
  # - script: make drift TENANT=<label>
  #   displayName: Drift detection (scheduled pipeline; set ZSCALER_* env via library)
  #   # exits 3 on drift — set continueOnError or wire a custom failure handler
  #   # to notify the team; exits 2 if TENANT is unset.
  #
  # - script: make check-envs
  #   displayName: Env-root consistency check (PR gate; fails on uncommitted drift)
