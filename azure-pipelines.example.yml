# Example Azure DevOps pipeline — a starting point, not a working config.
# Copy or point a pipeline definition at this file and adapt it to your
# environment: agent pool, terraform availability on the agents, and any
# proxy/registry mirrors. Keep it a thin shell over make — all logic lives
# in the Makefile (see AGENTS.md rule 9).
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: make env
    displayName: Toolchain versions
  - script: make test
    displayName: Python unit tests
  # `make validate` requires terraform on the agent. Hosted ubuntu images
  # ship it; for self-hosted pools either bake terraform into the agent
  # image or insert your installer task above this step, e.g. the
  # Microsoft DevLabs extension:
  # - task: TerraformInstaller@1
  #   inputs:
  #     terraformVersion: "1.15.4"
  - script: make validate
    displayName: Terraform format check
