# Thin shell over make — all logic lives in the Makefile (see AGENTS.md rule 9).
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: make test
    displayName: Python unit tests
  # Requires terraform on PATH — hosted ubuntu images ship it; self-hosted
  # work agents must provide it. Full pipeline lands in a later plan.
  - script: make validate
    displayName: Terraform format check
