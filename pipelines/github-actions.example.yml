# Example GitHub Actions workflows — reference material, not working config.
# Copy the jobs you need into .github/workflows/*.yml and fill the FILL-
# markers. Keep pipelines thin shells over make — all logic lives in the
# Makefile (AGENTS.md rule 9).

name: zscaler-as-code
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # hourly: hot-path resource drift (see drift job)
    - cron: "0 6 * * 0" # weekly: broad all-resource drift check

jobs:
  # ---- 1. Validation (PR gate) — no credentials, never touches state ----
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make test
      - run: make lint-pipelines   # cross-pipeline consistency (no tf/creds)
      - run: make validate
      - run: make typecheck TENANT=FILL-tenant-label
      - run: make lint TENANT=FILL-tenant-label
      - run: make test-envs TENANT=FILL-tenant-label
      - run: make validate-imports TENANT=FILL-tenant-label

  # ---- 1b. Floor tests (PR gate) -- tools/ under Python 3.6.8 ----
  # Everything under tools/ must run on the 3.6.8 floor (bare stdlib,
  # %-formatting, no f-strings). Mirrors `make test-floor` (dev-side
  # docker) but as a container job so CI enforces it too. Discovery root
  # is tools/tests with top-level dir `.` so the interpreter never reaches
  # runtime/ (which is 3.10+).
  test-floor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: python:3.6.8-slim
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tools/tests -t . -v

  # ---- 1c. Runtime tests (PR gate) -- runtime/ under uv + Python 3.10 ----
  # runtime/ is the modern (3.10+) tree, uv-managed. `--locked` fails the
  # job on a drifted uv.lock. Discovery root is runtime/tests with
  # top-level dir runtime, disjoint from the floor job's `-s tools/tests
  # -t .`, so the two interpreters never cross. The import guard enforces
  # the one-way wall: nothing under tools/ imports runtime/.
  test-runtime:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync --project runtime --locked
      - run: uv run --project runtime python -m unittest discover -s runtime/tests -t runtime -v
      - name: tools/ must not import runtime/
        run: make check-imports

  # ---- 2. Plan -> Apply (delivery) — needs real creds + state auth ----
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # OneAPI creds from repo/environment secrets; ARM_* or OIDC for state
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # plan-changed diffs against the merge-base
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make plan-changed BASE=origin/main~1 SAVE=1 BACKEND_CONFIG=backend.conf
      # save-plans collects every saved tfplan under a stable archive root
      # (reports/tfplans/<tenant>/<rt>/) regardless of overlay; the artifact
      # never hardcodes envs/, so it survives a deployment relocating its
      # tenants under $(OVERLAY)/envs.
      - run: make save-plans
      - uses: actions/upload-artifact@v4
        with:
          name: tfplans
          path: reports/tfplans/**
          retention-days: 3 # plans can contain sensitive values

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # FILL: protect this environment with required reviewers — that is the
    # approval gate between plan and apply.
    environment: FILL-protected-environment-name
    concurrency: tfstate-FILL-tenant-label # serialize applies per tenant
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - uses: actions/download-artifact@v4
        with:
          name: tfplans
          path: reports/tfplans/
      # restore-plans copies each tfplan from the archive back into the
      # resolved env root where `apply` reads it ($(OVERLAY)/envs/<t>/<rt>/);
      # the archive root is overlay-stable, the restore destination is not.
      - run: make restore-plans
      # Applies ONLY the saved plans; refuses destroys without ALLOW_DESTROY=1
      - run: make apply BACKEND_CONFIG=backend.conf

  # ---- 3. Drift (scheduled) -> automatic backfill PR ----
  # Two cadences from the two cron entries: hourly is scoped to the
  # hot-path resource (admins edit with no warning); weekly sweeps all.
  # Drift -> branch -> PR whose body is the item-level diff plus ZIA
  # audit-trail attribution (WHO changed it, advisory). The PR rides the
  # normal validation pipeline; drift-pr-plan below adds the real-plan
  # merge-readiness gate (a human still merges).
  # PRIVATE REPOS ONLY: the PR body/artifact carry live admin identities
  # and tenant-derived values — never run this drift job in a public
  # template/fork, or it would leak admin PII.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # git push of the backfill branch
      pull-requests: write     # gh pr create
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_RO_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_RO_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Scope by schedule
        run: |
          if [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
            echo "SCOPE=RESOURCE=zia_url_categories" >> "$GITHUB_ENV"  # FILL: hot-path resource
          else
            # RESOURCE also takes product tokens: to run with a product
            # disabled (e.g. ZCC until OneAPI), use SCOPE=RESOURCE="zia zpa"
            # instead of deleting its credentials (that turns runs red).
            echo "SCOPE=" >> "$GITHUB_ENV"
          fi
      - name: Detect drift
        id: drift
        run: |
          set +e
          make drift TENANT=FILL-tenant-label $SCOPE
          rc=$?
          set -e
          # make flattens recipe exit codes (any failing recipe -> exit 2),
          # so the drift tool's exit-3 never reaches us. Drift vs real
          # failure is decided by whether the worktree changed.
          if [ "$rc" -ne 0 ]; then
            if [ -n "$(git status --porcelain config/FILL-tenant-label imports/FILL-tenant-label)" ]; then
              echo "drifted=true" >> "$GITHUB_OUTPUT"
            else
              exit "$rc"
            fi
          fi
      - name: Render drift report (summary + audit attribution)
        if: steps.drift.outputs.drifted == 'true'
        run: |
          make drift-report TENANT=FILL-tenant-label
          # same markdown in the run summary (ADO uploadsummary equivalent)
          cat reports/FILL-tenant-label/drift.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.drift.outputs.drifted == 'true'
        with:
          name: drift-report
          path: reports/
      - name: Open backfill PR
        if: steps.drift.outputs.drifted == 'true'
        run: |
          branch="drift/FILL-tenant-label/$(date -u +%Y%m%dT%H%M)"
          git checkout -b "$branch"
          git add config/FILL-tenant-label imports/FILL-tenant-label
          git -c user.name=drift-bot -c user.email=drift-bot@invalid \
            commit -m "Backfill drift: FILL-tenant-label"
          git push -u origin "$branch"
          gh pr create --title "Drift backfill: FILL-tenant-label" \
            --body-file reports/FILL-tenant-label/drift.md

  # ---- 2b. Plan-as-PR-comment for config PRs ----
  # plan-changed scopes to the PR's own diff (docs-only PRs plan nothing
  # and the comment step skips). The plan lands as a PR comment so the
  # reviewer sees exactly what would change before merging.
  pr-plan:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'drift/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # gh pr comment
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make plan-changed BASE=origin/${{ github.base_ref }} SAVE=1 BACKEND_CONFIG=backend.conf
      - name: Comment the plan on the PR (skips when nothing planned)
        run: |
          ls envs/*/*/tfplan >/dev/null 2>&1 || { echo "no plannable changes"; exit 0; }
          make plan-report
          # GitHub comments cap at 65536 chars; truncate with a pointer.
          head -c 60000 reports/plan.md > /tmp/comment.md
          if [ "$(wc -c < reports/plan.md)" -gt 60000 ]; then
            printf '\n\n…truncated — full plan in the run artifacts.\n' >> /tmp/comment.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-plan
          path: reports/
          retention-days: 3 # plans can contain sensitive values

  # ---- 3b. Drift-PR merge-readiness check (a HUMAN merges) ----
  # Green here means: the backfill is a faithful snapshot — the real plan
  # is pure no-op (imports of new objects allowed). The reviewer reads
  # the PR body (what changed + audit attribution), sees this check, and
  # clicks merge. Red means the tenant moved again between fetch and
  # plan, or transform disagrees — look closer before merging.
  drift-pr-plan:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'drift/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # gh pr comment
    env:
      GH_TOKEN: ${{ github.token }}
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make plan-changed BASE=origin/main SAVE=1 BACKEND_CONFIG=backend.conf
      - name: Comment the plan on the drift PR
        run: |
          make plan-report
          head -c 60000 reports/plan.md > /tmp/comment.md
          if [ "$(wc -c < reports/plan.md)" -gt 60000 ]; then
            printf '\n\n…truncated — full plan in the run artifacts.\n' >> /tmp/comment.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      # comment first, THEN gate: the reviewer sees the plan even when red
      - run: make assert-clean
