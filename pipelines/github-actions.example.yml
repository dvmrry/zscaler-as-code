# Example GitHub Actions workflows — reference material, not working config.
# Copy the jobs you need into .github/workflows/*.yml and fill the FILL-
# markers. Keep pipelines thin shells over make — all logic lives in the
# Makefile (AGENTS.md rule 9).

name: zscaler-as-code
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # hourly: hot-path resource drift (see drift job)
    - cron: "0 6 * * 0" # weekly: broad all-resource drift check

jobs:
  # ---- 1. Validation (PR gate) — no credentials, never touches state ----
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make test
      - run: make validate
      - run: make typecheck TENANT=FILL-tenant-label
      - run: make lint TENANT=FILL-tenant-label
      - run: make test-envs TENANT=FILL-tenant-label

  # ---- 2. Plan -> Apply (delivery) — needs real creds + state auth ----
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # OneAPI creds from repo/environment secrets; ARM_* or OIDC for state
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # plan-changed diffs against the merge-base
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make plan-changed BASE=origin/main~1 SAVE=1 BACKEND_CONFIG=backend.conf
      - uses: actions/upload-artifact@v4
        with:
          name: tfplans
          path: envs/**/tfplan
          retention-days: 3 # plans can contain sensitive values

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # FILL: protect this environment with required reviewers — that is the
    # approval gate between plan and apply.
    environment: FILL-protected-environment-name
    concurrency: tfstate-FILL-tenant-label # serialize applies per tenant
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - uses: actions/download-artifact@v4
        with:
          name: tfplans
          path: envs/
      # Applies ONLY the saved plans; refuses destroys without ALLOW_DESTROY=1
      - run: make apply BACKEND_CONFIG=backend.conf

  # ---- 3. Drift (scheduled) -> automatic backfill PR ----
  # Two cadences from the two cron entries: hourly is scoped to the
  # hot-path resource (admins edit with no warning); weekly sweeps all.
  # Drift -> branch -> PR whose body is the item-level diff plus ZIA
  # audit-trail attribution (WHO changed it, advisory). The PR rides the
  # normal validation pipeline; drift-pr-plan below adds the real-plan
  # auto-merge gate.
  drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_RO_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_RO_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Scope by schedule
        run: |
          if [ "${{ github.event.schedule }}" = "0 * * * *" ]; then
            echo "SCOPE=RESOURCE=zia_url_categories" >> "$GITHUB_ENV"  # FILL: hot-path resource
          else
            echo "SCOPE=" >> "$GITHUB_ENV"
          fi
      - name: Detect drift
        id: drift
        run: |
          set +e
          make drift TENANT=FILL-tenant-label $SCOPE
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "drifted=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$rc" != "0" ] && [ "$rc" != "3" ]; then exit "$rc"; fi
      - name: Open backfill PR
        if: steps.drift.outputs.drifted == 'true'
        run: |
          branch="drift/FILL-tenant-label/$(date -u +%Y%m%dT%H%M)"
          python3 -m tools.drift_summary FILL-tenant-label > /tmp/pr-body.md
          python3 -m tools.audit FILL-tenant-label 24 >> /tmp/pr-body.md  # advisory; never fails
          git checkout -b "$branch"
          git add config/FILL-tenant-label imports/FILL-tenant-label
          git -c user.name=drift-bot -c user.email=drift-bot@invalid \
            commit -m "Backfill drift: FILL-tenant-label"
          git push -u origin "$branch"
          gh pr create --title "Drift backfill: FILL-tenant-label" \
            --body-file /tmp/pr-body.md

  # ---- 3b. Drift-PR gate: the real plan must be no-op, then auto-merge ----
  drift-pr-plan:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'drift/')
    runs-on: ubuntu-latest
    env:
      ZSCALER_CLIENT_ID: ${{ secrets.ZSCALER_CLIENT_ID }}
      ZSCALER_CLIENT_SECRET: ${{ secrets.ZSCALER_CLIENT_SECRET }}
      ZSCALER_VANITY_DOMAIN: ${{ secrets.ZSCALER_VANITY_DOMAIN }}
      ZSCALER_CLOUD: ${{ secrets.ZSCALER_CLOUD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
      - run: make plan-changed BASE=origin/main SAVE=1 BACKEND_CONFIG=backend.conf
      # Backfill means config now MATCHES the tenant: every saved plan
      # must be no-op (imports allowed). Anything else means the tenant
      # moved again or transform disagrees -> human review, no auto-merge.
      - run: make assert-clean
      - run: gh pr merge --auto --merge "$GITHUB_HEAD_REF"
