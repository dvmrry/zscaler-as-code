# Example scheduled drift -> backfill-PR pipeline — reference material, not
# a working config. Copy or point a pipeline at this file and adapt:
# schedules, pool, variable group names, tenant labels. Keep it a thin
# shell over make (AGENTS.md rule 9). The CI pipeline example
# (azure-pipelines.example.yml, same folder) covers tests/validation.
#
# PRIVATE REPOS ONLY: the drift PR body carries live admin identities
# (audit attribution) and tenant-derived values — never run this in a
# public template/fork, or the PR would leak admin PII.
#
# Two cadences via two schedules: ADO schedules cannot carry parameters,
# so the hot-path scope is derived from Build.CronSchedule.DisplayName.
schedules:
  - cron: "0 * * * *"
    displayName: hourly-hot-path
    branches:
      include:
        - main
    always: true
  - cron: "0 6 * * 0"
    displayName: weekly-broad
    branches:
      include:
        - main
    always: true

trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  # Adapt: a variable group holding ZSCALER_*/ZIA_*/ZPA_*/ZCC_* credentials
  # (secret variables; read-only API creds suffice for drift) and
  # REQUESTS_CA_BUNDLE if TLS inspection applies.
  - group: zscaler-credentials
  - name: TENANT
    value: replace-with-your-label
  - name: HOT_RESOURCE
    value: zia_url_categories # the resource admins edit with no warning

steps:
  - checkout: self
    persistCredentials: true # the backfill branch push uses the build token
  - script: |
      if [ "$(Build.CronSchedule.DisplayName)" = "hourly-hot-path" ]; then
        echo "##vso[task.setvariable variable=SCOPE]RESOURCE=$(HOT_RESOURCE)"
      else
        # RESOURCE also takes product tokens — to run with a product
        # disabled (e.g. ZCC until OneAPI is enabled), scope the broad
        # sweep instead of deleting credentials (which turns every run
        # red): RESOURCE="zia zpa"
        echo "##vso[task.setvariable variable=SCOPE]"
      fi
    displayName: Scope by schedule
  - script: |
      set +e
      make drift TENANT=$(TENANT) $(SCOPE)
      rc=$?
      set -e
      # make flattens recipe exit codes (any failing recipe -> exit 2),
      # so the drift tool's exit-3 never reaches us. Drift vs real
      # failure is decided by whether the worktree changed.
      if [ "$rc" -ne 0 ]; then
        if [ -n "$(git status --porcelain config/$(TENANT) imports/$(TENANT))" ]; then
          echo "##vso[task.setvariable variable=DRIFTED]true"
        else
          exit "$rc"
        fi
      fi
    displayName: Detect drift (non-zero + changed worktree = drift)
  - script: make drift-report TENANT=$(TENANT)
    displayName: Render drift report (summary + audit attribution)
    condition: eq(variables.DRIFTED, 'true')
  # Same markdown, three audiences: the run's Summary tab, a downloadable
  # pipeline (VSO) artifact, and the PR description below.
  - script: echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/reports/$(TENANT)/drift.md"
    displayName: Render report in the run Summary tab
    condition: eq(variables.DRIFTED, 'true')
  - publish: reports/$(TENANT)
    artifact: drift-report
    condition: eq(variables.DRIFTED, 'true')
  # Branch + commit + push + PR live in pipelines/commitback.sh — a
  # PULLED script, deliberately not inline YAML: adapted pipeline
  # definitions do not update on repo pull, and every commit-back
  # incident so far happened in an adapted inline block. The script is
  # az-free, checkpointed (the last `[commit-back N/5]` line printed
  # names the failing step), and never hangs: stdin is closed, git
  # prompts are disabled, curl is time-capped.
  # Requires the build service identity granted "Contribute" on this
  # repository (covers the branch push AND PR creation; without it the
  # push fails 403/TF401027) plus persistCredentials on checkout above.
  # A HUMAN merges — the PR carries the diff summary + audit
  # attribution, and the plan build policy shows merge-readiness;
  # review is read-and-click, not investigate.
  - script: bash pipelines/commitback.sh
    displayName: Open backfill PR
    condition: eq(variables.DRIFTED, 'true')
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken) # never auto-exposed
      TENANT: $(TENANT)
      BRANCH_PREFIX: drift
      PR_TITLE: "Drift backfill: $(TENANT)"
      DESCRIPTION_FILE: reports/$(TENANT)/drift.md
      ARTIFACT_NOTE: "_Full report in pipeline artifact: drift-report_"
      # Proxied egress? Declare it HERE too — curl reads only the env;
      # agent-level git proxy config gets the push through and then the
      # REST call hangs (field-hit):
      #   HTTPS_PROXY: $(HTTPS_PROXY)

# Merge-readiness build policy for drift/* PR branches (REAL creds):
#   - script: make plan-changed BASE=origin/main SAVE=1 BACKEND_CONFIG=backend.conf
#   - script: make assert-clean
# Green = the backfill is a faithful snapshot (plan is pure no-op;
# imports of new objects allowed) — the reviewer reads the PR body and
# clicks merge. Red = the tenant moved again between fetch and plan, or
# a transform gap: look closer before merging.
