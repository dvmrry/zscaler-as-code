# Example BOOTSTRAP pipeline — reference material, not a working config.
# For environments where users have NO direct blob-storage access: the
# first apply (state-only import adoption) must run on a pipeline agent,
# because plan/apply with the azurerm backend needs the state container.
#
# Everything stateless happens on a workstation per the RUNBOOK
# (fetch -> transform -> typecheck/lint -> commit config/imports/envs to
# the private repo) — OR in the optional agent-side refresh stage below
# when workstations can't run fetch. This pipeline's core is the
# state-touching half:
#   stage imports -> plan -> PROVE imports-only -> human approval -> apply
#
# assert-clean runs BEFORE the approval gate: the adoption signature is
# "N to import, 0 to add/change/destroy", and anything else stops the run
# red — the RUNBOOK's "do not apply until you understand the difference",
# mechanized. Manual trigger only; run per tenant (and optionally per
# resource — e.g. RESOURCE=zia_* product waves while ZCC stays disabled).
# Keep pipelines thin shells over make (AGENTS.md rule 9).

parameters:
  - name: tenant
    displayName: Tenant label
    type: string
  - name: resource
    # NOTE: default "all" (a sentinel), not "" — ADO's Run Pipeline UI
    # renders empty-default string parameters as REQUIRED, which invites
    # operators to type something wrong. "all" is visible and obvious.
    displayName: Resource scope ("all", one type, or a glob like zia_*)
    type: string
    default: all

trigger: none
pr: none

variables:
  # Variable group: tenant-prefixed ZSCALER creds (resolve via cred_env)
  # + ARM_SAS_TOKEN for the state container (SAS mode; see
  # backend.conf.example — resource_group_name omitted).
  - group: zscaler-credentials
  # Compile-time scope: parameters resolve before the run starts, so the
  # sentinel never reaches the shell.
  - name: SCOPE
    ${{ if ne(parameters.resource, 'all') }}:
      value: RESOURCE=${{ parameters.resource }}
    ${{ if eq(parameters.resource, 'all') }}:
      value: ""

# ---------------------------------------------------------------------------
# OPTIONAL refresh stage — generate config ON THE AGENT (for shops where
# workstations can't run fetch: no creds, no proxy path). If you enable
# this, the commit-back is NOT optional: the repo is the system of
# record, and a bootstrap that plans from uncommitted config leaves no
# reviewable record of what was imported — and the next drift run
# reports your own missing commit as drift. This mirrors the drift
# pipeline's backfill-branch pattern (same permissions: build identity
# needs "Contribute" + "Create branch"; PR creation needs "Contribute
# to pull requests").
#
# HANDOFF — the part that makes this NOT awkward: the run is fully
# self-contained; the PR merge never blocks it and nothing re-runs.
# Two correct shapes:
#   (a) SIMPLEST: put these steps at the TOP OF THE PLAN JOB itself
#       (same job as stage-imports/plan) — workspace continuity is
#       automatic and the branch push is a pure side-effect, or
#   (b) separate refresh stage: publish config/ + imports/ as a
#       PIPELINE ARTIFACT and download it in the plan job — the same
#       publish/download idiom the plan->apply tfplans handoff below
#       already uses, and it keeps the run independent of the branch
#       push succeeding (the PR stays the durable record without being
#       load-bearing for the run). Do NOT rely on a plain
#       `checkout: self` in a later stage — fresh workspaces would
#       silently plan from the OLD committed config. (Checking out the
#       pushed bootstrap/* branch also works, but couples the run to
#       push permissions; prefer the artifact.)
# The PR is the durable record a human merges at leisure — the only
# consumer of the MERGED repo is the next scheduled drift run, and
# even a forgotten merge self-heals (drift re-proposes the same
# content as a backfill PR).
#
#   - stage: refresh
#     jobs:
#       - job: generate
#         workspace:
#           clean: all
#         steps:
#           - checkout: self
#             persistCredentials: true # branch push uses the build token
#           - script: make fetch TENANT=${{ parameters.tenant }} $(SCOPE)
#             displayName: Fetch (creds from the variable group)
#             env:
#               ZSCALER_CLIENT_ID: $(ZSCALER_CLIENT_ID)
#               ZSCALER_CLIENT_SECRET: $(ZSCALER_CLIENT_SECRET)
#               ZSCALER_VANITY_DOMAIN: $(ZSCALER_VANITY_DOMAIN)
#               ZSCALER_CLOUD: $(ZSCALER_CLOUD)
#           - script: DROPS_CHECK=1 make transform IN=pulls/${{ parameters.tenant }} TENANT=${{ parameters.tenant }}
#             displayName: Transform (red = new API surface; triage, commit, re-run)
#           - script: make refresh-gates TENANT=${{ parameters.tenant }}
#             displayName: Inline gates (this config never sees a PR build first)
#             # refresh-gates = ADVISORY lint + strict typecheck. Advisory
#             # because freshly-FETCHED config is the tenant's current
#             # truth — lint errors in it are a console-cleanup worklist,
#             # not a reason to block adoption. The strict default stays
#             # the PR gate for hand edits. It is a make target rather
#             # than inline shell so gate behavior updates on repo pull —
#             # adapted pipeline YAML does not.
#           - script: |
#               if [ -z "$(git status --porcelain config/ imports/)" ]; then
#                 echo "config unchanged -- nothing to commit"; exit 0
#               fi
#               branch="bootstrap/${{ parameters.tenant }}/$(date -u +%Y%m%dT%H%M)"
#               git checkout -b "$branch"
#               git add config/ imports/
#               git -c user.name=bootstrap-bot -c user.email=bootstrap-bot@invalid \
#                 commit -m "bootstrap refresh: ${{ parameters.tenant }}"
#               git push -u origin "$branch"
#               printf '{"sourceRefName":"refs/heads/%s","targetRefName":"refs/heads/main","title":"bootstrap refresh: ${{ parameters.tenant }}","description":"Agent-generated config/imports backing this bootstrap run."}' "$branch" > /tmp/pr.json
#               curl -sf --max-time 60 -X POST \
#                 -H "Authorization: Bearer $(System.AccessToken)" \
#                 -H "Content-Type: application/json" \
#                 -d @/tmp/pr.json \
#                 "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullrequests?api-version=7.0" \
#                 > /dev/null && echo "commit-back PR opened from $branch"
#             displayName: Commit-back (the durable record of what was imported)
#           # curl + System.AccessToken, NOT az: on restricted agents
#           # `az extension add` hangs on egress and `az repos pr create`
#           # hangs waiting for a token on stdin -- both silently. curl
#           # fails loud or works (field-hit: branch pushed, PR step hung).
#           # pulls/ contains REAL tenant data -- never publish it as a
#           # pipeline artifact; it dies with the workspace by design.
# ---------------------------------------------------------------------------

stages:
  - stage: plan
    jobs:
      - job: plan
        pool:
          vmImage: ubuntu-latest
        # Fresh workspace EVERY run — the structural fix for stale-tfplan
        # contamination on reused self-hosted agents (make clean-plans is
        # the in-band layer; this is the platform layer).
        workspace:
          clean: all
        steps:
          - checkout: self
          # backend.conf: either commit it to the deployment repo (checkout
          # restores it; workspace cleans are then harmless) OR materialize
          # it from variables IN EVERY JOB that uses BACKEND_CONFIG —
          # workspace: clean: all wipes generated files at each job start.
          # - script: |
          #     printf 'storage_account_name = "%s"\ncontainer_name       = "%s"\n' \
          #       "$(STATE_STORAGE_ACCOUNT)" "$(STATE_CONTAINER)" > backend.conf
          #   displayName: Materialize backend.conf
          # Optional policy gates over the saved plans' NEW url-category adds
          # (subdomain redundancy vs wildcards; SSL-bypass exact-entry rule —
          # set SSL_EXEMPT_CATEGORY to your exemptions category's config key):
          #   terraform -chdir=envs/${{ parameters.tenant }}/zia_url_categories show -json tfplan > plan.json
          #   make plan-checks FILE=plan.json TENANT=${{ parameters.tenant }}
          - script: |
              eval "$(python3 -m tools.cred_env ${{ parameters.tenant }})"
              # Stale-plan hygiene: self-hosted agents REUSE workspaces, so a
              # failed/cancelled previous run leaves tfplans behind — and
              # apply's scope IS the saved plans. The run defines the plan set.
              make clean-plans
              # STATE_AWARE: re-runs are delta-only. Terraform errors on
              # importing an already-managed address, so already-imported
              # blocks are filtered against `terraform state list` — a full
              # re-run after partial success (or after drift adds new
              # objects) imports exactly what is missing.
              make stage-imports TENANT=${{ parameters.tenant }} STATE_AWARE=1 BACKEND_CONFIG=backend.conf $(SCOPE)
              make plan TENANT=${{ parameters.tenant }} SAVE=1 BACKEND_CONFIG=backend.conf $(SCOPE)
              # The adoption gate: every saved plan must be imports/no-op
              # ONLY. Real changes mean transform and the tenant disagree —
              # fix overrides and re-run; never approve past this red.
              make assert-clean
              make plan-report
            displayName: Stage imports, plan, prove imports-only
            env:
              ARM_SAS_TOKEN: $(ARM_SAS_TOKEN)
          - script: echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/reports/plan.md"
            displayName: Plan in the run Summary tab
          - publish: envs
            artifact: tfplans # plans can contain sensitive values; restrict retention
          - publish: reports
            artifact: plan-report

  - stage: apply
    dependsOn: plan
    jobs:
      - deployment: apply
        pool:
          vmImage: ubuntu-latest
        workspace:
          clean: all
        # THE MANUAL REVIEW GATE LIVES HERE — and it is PORTAL CONFIG,
        # not yaml: naming an environment does NOTHING by itself. In ADO:
        # Pipelines > Environments > <this environment> > Approvals and
        # checks > add Approvals (reviewers) + Exclusive Lock. Without
        # that, this stage runs straight through. Suggested approval
        # instructions text: "Open the run's Summary tab — the plan
        # summary table is at the top. Bootstrap expects import-only
        # rows (0 add / 0 change / 0 destroy)."
        environment: FILL-protected-environment-name
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                # If backend.conf is materialized from variables, repeat the
                # materialize step HERE — this job's workspace was cleaned.
                - script: |
                    # Reproduce the EXACT plan-time worktree: a saved plan
                    # is only valid against identical configuration, so the
                    # import blocks must be staged identically (state has
                    # not changed between the stages — same filter result).
                    eval "$(python3 -m tools.cred_env ${{ parameters.tenant }})"
                    make stage-imports TENANT=${{ parameters.tenant }} STATE_AWARE=1 BACKEND_CONFIG=backend.conf $(SCOPE)
                  displayName: Re-stage imports (config parity for saved plans)
                  env:
                    ARM_SAS_TOKEN: $(ARM_SAS_TOKEN)
                - download: current
                  artifact: tfplans
                - script: cp -R "$(Pipeline.Workspace)/tfplans/"* envs/
                  displayName: Restore saved plans
                - script: |
                    eval "$(python3 -m tools.cred_env ${{ parameters.tenant }})"
                    # Imports only mutate STATE, never the tenant; the
                    # destroy guard still applies (nothing to allow here).
                    # TENANT + $(SCOPE) on apply too — DEFENSE IN DEPTH:
                    # even a contaminated artifact (stale tfplans from a
                    # reused workspace published alongside) cannot apply
                    # outside the run's declared scope. Field-hit: a
                    # ZIA-targeted run applied stale ZPA plans.
                    make apply TENANT=${{ parameters.tenant }} BACKEND_CONFIG=backend.conf $(SCOPE)
                  displayName: Apply (state-only import adoption)
                  env:
                    ARM_SAS_TOKEN: $(ARM_SAS_TOKEN)
# After a successful bootstrap: the staged import copies lived only in
# this agent's workspace — nothing to clean up in git. Subsequent changes
# ride the normal delivery pipeline; drift goes green-by-construction.
