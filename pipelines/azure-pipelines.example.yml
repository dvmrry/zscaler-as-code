# Example Azure DevOps pipeline — reference material, not a working config.
# Bootstrapping a NEW environment: copy this file to azure-pipelines.yml in
# your repo and adapt it (agent pool, terraform availability on the agents,
# proxy/registry mirrors). If an adapted azure-pipelines.yml already exists,
# keep it — never delete it or repoint CI at this example.
# Keep pipelines thin shells over make — all logic lives in the Makefile
# (see AGENTS.md rule 9).
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: make env
    displayName: Toolchain versions
  - script: make test
    displayName: Python unit tests
  # Cross-pipeline consistency: terraform-version drift, hand-rolled auth
  # blocks, config vars in step env, backend.conf strategy. Lints the YAML in
  # pipelines/ (no terraform/creds needed). Point DIR at your operative
  # pipelines if they live elsewhere.
  - script: make lint-pipelines
    displayName: Pipeline consistency lint
  # `make validate` requires terraform on the agent. Hosted ubuntu images
  # ship it; for self-hosted pools either bake terraform into the agent
  # image or insert your installer task above this step, e.g. the
  # Microsoft DevLabs extension:
  # - task: TerraformInstaller@1
  #   inputs:
  #     terraformVersion: "1.15.4"
  - script: make validate
    displayName: Terraform format check
  # Config gates run against a committed tenant; `demo` ships with the
  # template so these pass verbatim — point them at your tenant label once
  # real config is committed (these catch hand-edit mistakes the plan
  # stage would otherwise hit much later).
  - script: make typecheck TENANT=demo
    displayName: Config typecheck
  - script: make lint TENANT=demo
    displayName: Config semantic lint
  # Drift detection, env-root consistency, and import-address validation are
  # adopter concerns: scheduling, credential injection, and failure routing
  # depend on your ADO setup. Commented-out examples for reference:
  #
  # - script: make drift TENANT=<label>
  #   displayName: Drift detection (scheduled pipeline; set ZSCALER_* env via library)
  #   # exits 3 on drift — set continueOnError or wire a custom failure handler
  #   # to notify the team; exits 2 if TENANT is unset.
  #
  # - script: make check-envs
  #   displayName: Env-root consistency check (PR gate; fails on uncommitted drift)
  #
  # - script: make validate-imports TENANT=<label>
  #   displayName: Import-address check (PR gate; verifies each import block resolves)

# ---------------------------------------------------------------------------
# Delivery (plan -> approval -> apply) is its OWN pipeline, one per tenant:
# see azure-pipelines-delivery.example.yml. It triggers on a merge to main,
# plans only the roots the merge touched (make plan-changed, tenant-scoped),
# gates on a short-lived approval, and applies only the saved plans — there is
# no apply-all to misfire. Kept separate because its credentials, protected
# environment, and approval chain are per-tenant; this validation pipeline
# stays creds-free.

