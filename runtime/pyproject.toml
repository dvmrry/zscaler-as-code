[project]
name = "zac-runtime"
version = "0.1.0"
description = "Modern (3.10+) gate runner for zscaler-as-code; shells make, never imports tools/ at runtime in v1."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zac-gate = "zac_runtime.gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zac_runtime"]

[dependency-groups]
dev = []
